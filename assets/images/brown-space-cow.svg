<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Space background -->
  <rect width="400" height="400" fill="#0a0a1a"/>
  
  <!-- Stars -->
  <circle cx="50" cy="60" r="2" fill="white"/>
  <circle cx="120" cy="40" r="1.5" fill="white"/>
  <circle cx="200" cy="70" r="2" fill="white"/>
  <circle cx="280" cy="50" r="1.5" fill="white"/>
  <circle cx="350" cy="90" r="2" fill="white"/>
  <circle cx="80" cy="150" r="1.5" fill="white"/>
  <circle cx="320" cy="130" r="2" fill="white"/>
  <circle cx="150" cy="200" r="1.5" fill="white"/>
  <circle cx="380" cy="200" r="1.5" fill="white"/>
  <circle cx="250" cy="250" r="2" fill="white"/>
  <circle cx="40" cy="300" r="1.5" fill="white"/>
  <circle cx="300" cy="320" r="2" fill="white"/>
  
  <!-- Nebula -->
  <ellipse cx="100" cy="300" rx="150" ry="80" fill="#8b4a8b" opacity="0.3"/>
  <ellipse cx="300" cy="100" rx="120" ry="60" fill="#4a4a8b" opacity="0.3"/>
  
  <!-- Earth in distance -->
  <circle cx="340" cy="340" r="20" fill="#1e90ff"/>
  <circle cx="340" cy="340" r="16" fill="#228b22"/>
  <circle cx="340" cy="340" r="14" fill="#f0f0f0" opacity="0.6"/>
  
  <!-- Cow body -->
  <ellipse cx="200" cy="260" rx="70" ry="45" fill="#8b4513"/>
  <ellipse cx="200" cy="250" rx="55" ry="35" fill="#a0522d"/>
  
  <!-- Cow spots -->
  <ellipse cx="170" cy="245" rx="12" ry="8" fill="#5c3317" transform="rotate(-15 170 245)"/>
  <ellipse cx="230" cy="270" rx="15" ry="10" fill="#5c3317" transform="rotate(20 230 270)"/>
  <ellipse cx="150" cy="280" rx="10" ry="7" fill="#5c3317"/>
  
  <!-- Cow head -->
  <circle cx="130" cy="200" r="35" fill="#8b4513"/>
  <circle cx="130" cy="190" r="28" fill="#a0522d"/>
  
  <!-- Cow ears -->
  <ellipse cx="100" cy="185" rx="14" ry="9" fill="#8b4513" transform="rotate(-30 100 185)"/>
  <ellipse cx="160" cy="185" rx="14" ry="9" fill="#8b4513" transform="rotate(30 160 185)"/>
  
  <!-- Cow horns (space-themed, like little rockets) -->
  <path d="M 110 175 L 90 140 L 100 175 Z" fill="#5c3317"/>
  <path d="M 150 175 L 170 140 L 160 175 Z" fill="#5c3317"/>
  
  <!-- Cow eyes -->
  <circle cx="120" cy="188" r="4" fill="white"/>
  <circle cx="120" cy="188" r="2" fill="black"/>
  <circle cx="140" cy="188" r="4" fill="white"/>
  <circle cx="140" cy="188" r="2" fill="black"/>
  
  <!-- Cow snout -->
  <ellipse cx="130" cy="210" rx="14" ry="9" fill="#a0522d"/>
  <circle cx="122" cy="208" r="3" fill="#5c3317"/>
  <circle cx="138" cy="208" r="3" fill="#5c3317"/>
  
  <!-- Cow legs -->
  <rect x="170" y="285" width="12" height="30" fill="#8b4513"/>
  <rect x="190" y="285" width="12" height="30" fill="#8b4513"/>
  <rect x="220" y="285" width="12" height="30" fill="#8b4513"/>
  <rect x="240" y="285" width="12" height="30" fill="#8b4513"/>
  
  <!-- Hooves -->
  <rect x="170" y="312" width="12" height="6" fill="#5c3317"/>
  <rect x="190" y="312" width="12" height="6" fill="#5c3317"/>
  <rect x="220" y="312" width="12" height="6" fill="#5c3317"/>
  <rect x="240" y="312" width="12" height="6" fill="#5c3317"/>
  
  <!-- Tail -->
  <path d="M 260 255 Q 290 260 280 280" stroke="#8b4513" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="280" cy="280" r="6" fill="#5c3317"/>
  
  <!-- Space helmet visor reflection on cow's head -->
  <path d="M 115 185 Q 130 175 145 185 Q 130 195 115 185 Z" fill="#e0f7fa" opacity="0.4"/>
  
  <!-- Little astronaut badge on cow -->
  <circle cx="200" cy="260" r="12" fill="#1e90ff" opacity="0.8"/>
  <circle cx="200" cy="260" r="8" fill="white" opacity="0.9"/>
  
  <!-- Text label -->
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="16" fill="#c9d1d9" text-anchor="middle">Brown Space Cow</text>
</svg>